version: 2
# Dependency update pull requests are never auto-merged; each one goes through
# CI and review like any other change.
#
# The cargo ecosystem is commented out until this repository has a manifest.
# Dependabot errors on a declared ecosystem it cannot find, so uncomment the
# block below as part of scaffolding the project.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type:infra"

